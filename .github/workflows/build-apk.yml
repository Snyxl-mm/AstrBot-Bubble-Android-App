name: Build APK

# 手机端（arm64 容器）无法构建 Flutter APK：Flutter 官方不发布 linux-arm64 host
# SDK，Android SDK 的 aapt2/build-tools 也只有 x86_64，且容器没有 binfmt_misc 与
# CAP_SYS_ADMIN，x86_64 子进程无法 exec。所以 APK 在这里（GitHub 托管 runner，x64）
# 构建，产物直接作为 artifact 下载即可安装。
on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: '构建模式'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
      flutter_version:
        description: 'Flutter 版本（留空用 stable 最新）'
        required: false
        default: ''
  push:
    branches: [master, main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/gradle-wrapper.properties', '**/*.gradle') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ inputs.flutter_version }}
          cache: true

      - name: Toolchain info
        run: |
          flutter --version
          java -version
          echo "ARCH=$(uname -m) CORES=$(nproc)"
          echo "--- gradle wrapper:"; grep distributionUrl android/gradle/wrapper/gradle-wrapper.properties
          echo "--- plugins:"; grep -E "com\\.android\\.application|kotlin\\.android" android/settings.gradle

      # 可选：配置 release 签名。在仓库 Settings → Secrets 里放好
      # KEYSTORE_BASE64 / STORE_PASSWORD / KEY_PASSWORD / KEY_ALIAS 即生效；
      # 不配置时 build.gradle 会自动回退到 debug 签名，APK 依然可直接安装。
      - name: Prepare release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -n "${KEYSTORE_BASE64}" ]; then
            echo "配置 release 签名"
            echo "${KEYSTORE_BASE64}" | base64 -d > android/app/release.jks
            cat > android/key.properties <<EOF
          storePassword=${STORE_PASSWORD}
          keyPassword=${KEY_PASSWORD}
          keyAlias=${KEY_ALIAS}
          storeFile=release.jks
          EOF
          else
            echo "未配置 keystore，回退 debug 签名"
          fi

      - name: Pub get
        run: flutter pub get

      - name: Analyze (non-blocking)
        continue-on-error: true
        run: flutter analyze

      - name: Bump Gradle/AGP/Kotlin to Flutter minimums
        # 上游模板锁的是 Gradle 8.11.1 / AGP 8.9.1 / Kotlin 2.1.0；
        # Flutter 3.40+ 要求 Gradle ≥8.14、AGP ≥8.11.1、Kotlin ≥2.2.20
        run: |
          python3 - <<'PYEOF'
          import pathlib, re
          b = pathlib.Path("android")
          w = b / "gradle/wrapper/gradle-wrapper.properties"
          w.write_text(re.sub(r"gradle-[0-9.]+-bin\.zip", "gradle-8.14.3-bin.zip", w.read_text()))
          s = b / "settings.gradle"
          t = s.read_text()
          t = re.sub(r"(id 'com\.android\.application' version ')[^']+(')", r"\g<1>8.11.1\g<2>", t)
          t = re.sub(r"(id 'org\.jetbrains\.kotlin\.android' version ')[^']+(')", r"\g<1>2.2.20\g<2>", t)
          s.write_text(t)
          print("gradle:", re.search(r"gradle-[0-9.]+-bin", w.read_text()).group(0))
          for line in t.splitlines():
              if "com.android.application" in line or "kotlin.android" in line:
                  print("plugin:", line.strip())
          PYEOF

      - name: Build APK
        id: build
        continue-on-error: true
        run: |
          df -h / | tail -1
          set +e
          flutter build apk --release --target-platform android-arm64 2>&1 | tail -220
          rc=${PIPESTATUS[0]}
          echo "flutter_exit=$rc"
          df -h / | tail -1
          exit 0

      - name: Inspect build outputs
        if: always()
        run: |
          echo "=== apk/aab 搜索 ==="
          find . -name '*.apk' -o -name '*.aab' 2>/dev/null | head -30
          echo "=== android/app/build/outputs ==="
          ls -R android/app/build/outputs 2>/dev/null | head -60 || true
          echo "=== build/app/outputs ==="
          ls -R build/app/outputs 2>/dev/null | head -40 || true

      - name: Collect artifacts
        if: always()
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          # 只取主包，排除 profileTest 变体与重复拷贝（artifact 从 228MB 降到 ~73MB）
          sel=$(find . \( -name 'app-normal-release.apk' -o -name 'app-release.apk' \) -print -quit)
          if [ -z "$sel" ]; then
            sel=$(find . -name '*.apk' ! -name '*profileTest*' ! -name '*profiletest*' -print -quit)
          fi
          echo "选中: $sel"
          [ -n "$sel" ] && cp -v "$sel" "$GITHUB_WORKSPACE/dist/AstrBot-SnowLuma-release.apk"
          ls -lh "$GITHUB_WORKSPACE/dist"
          (cd "$GITHUB_WORKSPACE/dist" && sha256sum *.apk > SHA256SUMS.txt) 2>/dev/null || true

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astrbot-bubble-apk-${{ github.sha }}
          path: |
            dist/*.apk
            dist/SHA256SUMS.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
